name: Monthly Contribution Graph

on:
  schedule:
    - cron: "0 1 * * *"   # runs once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate monthly graph
        run: python scripts/monthly_graph.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a secret named GH_PAT to include private contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Commit the updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/monthly-contributions.svg
          git diff --staged --quiet || (git commit -m "Update monthly contribution graph" && git push)
